<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mundo iPhone - Contacto</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,400;0,600;0,700;0,800;1,100;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo">Mundo iPhone</div>
      <nav>
        <a href="../index.html"><i class="fas fa-home"></i> Inicio</a>
        <a href="contacto.html"><i class="fas fa-envelope"></i> Contacto</a>
        <a href="carrito.html"><i class="fas fa-shopping-cart"></i> Carrito</a>
      </nav>
    </header>

    <main class="container principal">
      <div class="caja-contacto">
        <section class="info">
          <h3>Ubicación</h3>
          <p>Av. España 400<br />Tandil, Buenos Aires</p>

          <h3>Redes Sociales</h3>
          <div class="redes">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-whatsapp"></i></a>
          </div>
        </section>

        <section class="form">
          <h2>Ponte en contacto con nosotros</h2>
          <form action="https://formspree.io/f/xyezazga" method="POST">
            <div class="campo">
              <input
                type="text"
                name="nombre"
                placeholder="Nombre completo"
                required
                aria-label="Nombre completo"
              />
            </div>
            <div class="campo">
              <input
                type="email"
                name="email"
                placeholder="Correo electrónico válido"
                required
                aria-label="Correo electrónico"
              />
            </div>
            <div class="campo">
              <textarea
                name="mensaje"
                rows="4"
                placeholder="Escribe tu mensaje aquí..."
                required
                aria-label="Mensaje"
              ></textarea>
            </div>
            <button type="submit" class="btn-enviar">Enviar</button>
          </form>
        </section>
      </div>
    </main>

    <footer>
      <p class="copy">
        &copy; 2026 Mundo iPhone. Todos los derechos reservados.
      </p>
      <div class="footer-info">
        <span
          ><i class="fas fa-map-marker-alt"></i> Av. España 400, Tandil</span
        >
        <a href="#" class="enlace"
          ><i class="fab fa-whatsapp"></i> 249 452365</a
        >
        <a href="#" class="enlace"
          ><i class="fab fa-instagram"></i> @mundoIphone</a
        >
      </div>
    </footer>
  </body>
</html>
