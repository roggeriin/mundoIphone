<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mundo iPhone - Carrito</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,400;0,600;0,700;0,800;1,100;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo">Mundo iPhone</div>
      <nav>
        <a href="../index.html"><i class="fas fa-home"></i> Inicio</a>
        <a href="contacto.html"><i class="fas fa-envelope"></i> Contacto</a>
        <a href="carrito.html">
          <span class="caja-icono">
            <i class="fas fa-shopping-cart"></i>
            <span id="contador-carrito" class="badge-carrito">0</span>
          </span>
          Carrito
        </a>
      </nav>
    </header>

    <main class="container principal">
      <h2 class="titulo">Tu Carrito de Compras</h2>
      <div class="caja-carrito">
        <section class="lista-carrito">
          <!-- JS inserta los productos acá automáticamente -->
        </section>
        <aside class="resumen-carrito">
          <h3>Resumen de Compra</h3>
          <div class="fila-resumen">
            <span>Subtotal</span>
            <span id="monto-subtotal">$0.00</span>
          </div>
          <div class="fila-resumen">
            <span>Envío</span>
            <span>Gratis</span>
          </div>
          <div class="fila-resumen total-final">
            <span>Total</span>
            <span id="monto-total">$0.00</span>
          </div>
          <button class="btn-pagar">Proceder al Pago</button>
        </aside>
      </div>
    </main>

    <footer>
      <p class="copy">
        &copy; 2026 Mundo iPhone. Todos los derechos reservados.
      </p>
      <div class="footer-info">
        <span
          ><i class="fas fa-map-marker-alt"></i> Av. España 400, Tandil</span
        >
        <a href="#" class="enlace"
          ><i class="fab fa-whatsapp"></i> 249 452365</a
        >
        <a href="#" class="enlace"
          ><i class="fab fa-instagram"></i> @mundoIphone</a
        >
      </div>
    </footer>

    <!-- Único script necesario para la página del carrito -->
    <!-- Nota: Si tu carrito.html está guardado adentro de una carpeta "pages", acordate de poner "../" al principio de la ruta -->
    <script type="module" src="../js/carrito.js"></script>
  </body>
</html>
